<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="620" fill="#0f172a"/>

  <text x="450" y="52" text-anchor="middle" fill="#f8fafc" font-size="30" font-weight="700">Vok Feature Vision</text>
  <text x="450" y="80" text-anchor="middle" fill="#94a3b8" font-size="16">Helping people who cannot communicate, communicate more effectively</text>

  <!-- Center hub -->
  <circle cx="450" cy="330" r="72" fill="#38bdf8"/>
  <text x="450" y="322" text-anchor="middle" fill="#082f49" font-size="26" font-weight="700">VOK</text>
  <text x="450" y="348" text-anchor="middle" fill="#082f49" font-size="13">one core, many</text>
  <text x="450" y="365" text-anchor="middle" fill="#082f49" font-size="13">voices</text>

  <!-- Ring 1 bubbles -->
  <!-- Expressive -->
  <g transform="translate(170,150)">
    <circle cx="0" cy="0" r="88" fill="#38bdf8" opacity="0.16"/>
    <circle cx="0" cy="0" r="88" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="-14" text-anchor="middle" fill="#38bdf8" font-size="17" font-weight="600">Expressive</text>
    <text x="0" y="8" text-anchor="middle" fill="#bae6fd" font-size="13">personal voice</text>
    <text x="0" y="26" text-anchor="middle" fill="#bae6fd" font-size="13">symbols, emotion,</text>
    <text x="0" y="44" text-anchor="middle" fill="#bae6fd" font-size="13">one-tap phrases</text>
  </g>

  <!-- Input -->
  <g transform="translate(450,120)">
    <circle cx="0" cy="0" r="88" fill="#a78bfa" opacity="0.16"/>
    <circle cx="0" cy="0" r="88" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <text x="0" y="-14" text-anchor="middle" fill="#a78bfa" font-size="17" font-weight="600">Input for</text>
    <text x="0" y="6" text-anchor="middle" fill="#a78bfa" font-size="17" font-weight="600">every body</text>
    <text x="0" y="28" text-anchor="middle" fill="#ddd6fe" font-size="13">touch, switches,</text>
    <text x="0" y="46" text-anchor="middle" fill="#ddd6fe" font-size="13">gaze, head, puff</text>
  </g>

  <!-- Understanding -->
  <g transform="translate(730,150)">
    <circle cx="0" cy="0" r="88" fill="#f472b6" opacity="0.16"/>
    <circle cx="0" cy="0" r="88" fill="none" stroke="#f472b6" stroke-width="2"/>
    <text x="0" y="-14" text-anchor="middle" fill="#f472b6" font-size="17" font-weight="600">Understands</text>
    <text x="0" y="6" text-anchor="middle" fill="#f472b6" font-size="17" font-weight="600">the person</text>
    <text x="0" y="28" text-anchor="middle" fill="#fbcfe8" font-size="13">adaptive vocab,</text>
    <text x="0" y="46" text-anchor="middle" fill="#fbcfe8" font-size="13">personal layouts</text>
  </g>

  <!-- Beyond screen -->
  <g transform="translate(730,510)">
    <circle cx="0" cy="0" r="88" fill="#34d399" opacity="0.16"/>
    <circle cx="0" cy="0" r="88" fill="none" stroke="#34d399" stroke-width="2"/>
    <text x="0" y="-14" text-anchor="middle" fill="#34d399" font-size="17" font-weight="600">Beyond the</text>
    <text x="0" y="6" text-anchor="middle" fill="#34d399" font-size="17" font-weight="600">screen</text>
    <text x="0" y="28" text-anchor="middle" fill="#a7f3d0" font-size="13">transcripts,</text>
    <text x="0" y="46" text-anchor="middle" fill="#a7f3d0" font-size="13">translation, actions</text>
  </g>

  <!-- Independence -->
  <g transform="translate(170,510)">
    <circle cx="0" cy="0" r="88" fill="#fbbf24" opacity="0.16"/>
    <circle cx="0" cy="0" r="88" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <text x="0" y="-14" text-anchor="middle" fill="#fbbf24" font-size="17" font-weight="600">Independence</text>
    <text x="0" y="8" text-anchor="middle" fill="#fde68a" font-size="13">offline-first,</text>
    <text x="0" y="26" text-anchor="middle" fill="#fde68a" font-size="13">affordable,</text>
    <text x="0" y="44" text-anchor="middle" fill="#fde68a" font-size="13">collaborative setup</text>
  </g>

  <!-- connector lines -->
  <line x1="450" y1="260" x2="263" y2="222" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5,4" opacity="0.5"/>
  <line x1="450" y1="264" x2="450" y2="215" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5,4" opacity="0.5"/>
  <line x1="450" y1="260" x2="637" y2="222" stroke="#f472b6" stroke-width="2" stroke-dasharray="5,4" opacity="0.5"/>
  <line x1="450" y1="398" x2="637" y2="438" stroke="#34d399" stroke-width="2" stroke-dasharray="5,4" opacity="0.5"/>
  <line x1="450" y1="398" x2="263" y2="438" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5,4" opacity="0.5"/>
</svg>