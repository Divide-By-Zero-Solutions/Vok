<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340" font-family="Segoe UI, Arial, sans-serif">
  <rect width="920" height="340" fill="#0f172a"/>

  <text x="460" y="44" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="700">From intent to independence</text>

  <!-- Step 1 -->
  <g>
    <rect x="30" y="110" width="170" height="130" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="115" y="150" text-anchor="middle" fill="#38bdf8" font-size="15" font-weight="600">1 · Decide</text>
    <text x="115" y="176" text-anchor="middle" fill="#cbd5e1" font-size="13">A thought, need,</text>
    <text x="115" y="194" text-anchor="middle" fill="#cbd5e1" font-size="13">or feeling forms</text>
    <text x="115" y="212" text-anchor="middle" fill="#cbd5e1" font-size="13">in the person</text>
  </g>

  <g transform="translate(217,175) rotate(0)">
    <polygon points="0,0 22,-10 22,10" fill="#64748b"/>
  </g>

  <!-- Step 2 -->
  <g>
    <rect x="240" y="110" width="170" height="130" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <text x="325" y="150" text-anchor="middle" fill="#a78bfa" font-size="15" font-weight="600">2 · Input</text>
    <text x="325" y="176" text-anchor="middle" fill="#cbd5e1" font-size="13">Touch, switch,</text>
    <text x="325" y="194" text-anchor="middle" fill="#cbd5e1" font-size="13">gaze, or puff —</text>
    <text x="325" y="212" text-anchor="middle" fill="#cbd5e1" font-size="13">whatever works</text>
  </g>

  <g transform="translate(427,175) rotate(0)">
    <polygon points="0,0 22,-10 22,10" fill="#64748b"/>
  </g>

  <!-- Step 3 -->
  <g>
    <rect x="450" y="110" width="170" height="130" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="535" y="150" text-anchor="middle" fill="#34d399" font-size="15" font-weight="600">3 · Vok</text>
    <text x="535" y="176" text-anchor="middle" fill="#cbd5e1" font-size="13">Symbols, prediction,</text>
    <text x="535" y="194" text-anchor="middle" fill="#cbd5e1" font-size="13">and your own voice</text>
    <text x="535" y="212" text-anchor="middle" fill="#cbd5e1" font-size="13">build the message</text>
  </g>

  <g transform="translate(637,175) rotate(0)">
    <polygon points="0,0 22,-10 22,10" fill="#64748b"/>
  </g>

  <!-- Step 4 -->
  <g>
    <rect x="660" y="110" width="170" height="130" rx="14" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
    <text x="745" y="150" text-anchor="middle" fill="#f472b6" font-size="15" font-weight="600">4 · Connect</text>
    <text x="745" y="176" text-anchor="middle" fill="#cbd5e1" font-size="13">The partner hears,</text>
    <text x="745" y="194" text-anchor="middle" fill="#cbd5e1" font-size="13">understands, and</text>
    <text x="745" y="212" text-anchor="middle" fill="#cbd5e1" font-size="13">responds</text>
  </g>

  <rect x="30" y="270" width="800" height="40" rx="10" fill="#38bdf8" opacity="0.12"/>
  <text x="430" y="296" text-anchor="middle" fill="#bae6fd" font-size="14">Independence = being understood without needing someone else to speak for you</text>
</svg>